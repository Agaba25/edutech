services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: educareer
      DB_PASS: educareer_secret
      DB_NAME: educareer_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: educareer_db
      MYSQL_USER: educareer
      MYSQL_PASSWORD: educareer_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - ./database_enhanced.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 12
